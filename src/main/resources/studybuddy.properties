# Default StudyBuddy settings.
# Any key can be overridden by an environment variable or a .env entry named
# STUDYBUDDY_ + the key in upper case with dots as underscores (db.path -> STUDYBUDDY_DB_PATH).
# The API key is never stored here: it comes from GEMINI_API_KEY.

# Local SQLite database file (relative paths are resolved against the working directory)
db.path=data/studybuddy.db

# Gemini model IDs
llm.model.routine=gemini-3.1-flash-lite
# The Study Coach makes several calls per message, so it needs a fast model with generous free-tier limits
llm.model.coach=gemini-3.1-flash-lite
llm.model.embedding=gemini-embedding-001
llm.max.retries=2
llm.timeout.seconds=60
# most words of material text per prompt; longer materials are processed in parts (concept extraction)
llm.prompt.word.budget=6000

# F01 ingestion
ingest.max.file.mb=20
ingest.chunk.words=400
ingest.chunk.overlap=50

# F03 retrieval
retrieval.top.k=6
# minimum cosine similarity for an excerpt to count as relevant (embedding search)
retrieval.min.similarity=0.5

# F08 mastery
mastery.weak.threshold=60

# F09 agent
agent.max.steps=8
